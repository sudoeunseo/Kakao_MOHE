services:
  - type: web
    name: mohe-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: GEMINI_URL_MODEL
        value: gemini-3.5-flash-lite
      - key: KAKAOPAY_CID
        value: TC0ONETIME
      - key: KAKAOPAY_SECRET_KEY
        sync: false
      - key: KAKAO_REST_API_KEY
        sync: false
      - key: KAKAO_CLIENT_SECRET
        sync: false
      - key: KAKAO_REDIRECT_URI
        value: https://kakao-mohe.onrender.com/api/auth/kakao/callback
      - key: FRONTEND_URL
        value: https://kakao-mohe.onrender.com
